<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Up Your Account — TideVenture CPA</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--sand); font-family: var(--font-body); }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem 2rem; width: 100%; max-width: 460px; box-shadow: var(--shadow-sm); }
    .card h1 { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 800; color: var(--brand-dark); margin: 0 0 0.3rem; }
    .card p { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 1.25rem; line-height: 1.5; }
    .card .summary { background: var(--brand-pale); border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.82rem; }
    .card .summary .row { display: flex; justify-content: space-between; padding: 0.2rem 0; }
    .card .summary .row .val { font-weight: 600; color: var(--ink); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink); margin-bottom: 0.25rem; }
    .form-group input { width: 100%; padding: 0.6rem 0.75rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; outline: none; box-sizing: border-box; }
    .form-group input:focus { border-color: var(--brand-teal); }
    .card .btn--primary { width: 100%; }
    .card .note { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.3rem; }
    .error { font-size: 0.78rem; color: #c00; display: none; margin-bottom: 0.75rem; }
    .success { display: none; text-align: center; padding: 1rem 0; }
    .success h2 { font-family: var(--font-heading); font-size: 1.15rem; color: var(--brand-dark); margin: 0 0 0.5rem; }
    .success p { font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loadingView" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading…</div>

  <div class="card" id="formView" style="display:none;">
    <div style="display:flex;justify-content:center;margin-bottom:1.25rem;">
      <svg width="46" height="46" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="5" fill="#0d3f5e"/>
        <rect x="7" y="20" width="5.5" height="12" rx="1.5" fill="rgba(255,255,255,0.45)"/>
        <rect x="15.5" y="14" width="5.5" height="18" rx="1.5" fill="rgba(255,255,255,0.7)"/>
        <rect x="24" y="8" width="5.5" height="24" rx="1.5" fill="rgba(255,255,255,0.92)"/>
        <path d="M4 33 Q10 29 16 33 T28 33 T36 33" stroke="#1a7fa0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 style="text-align:center;">Welcome to TideVenture CPA</h1>
    <p style="text-align:center;">Review your engagement details and create your password to activate your secure client portal.</p>
    <div class="error" id="errorMsg"></div>
    <div class="summary" id="pricingSummary"></div>
    <form id="setupForm">
      <div class="form-group">
        <label for="password">Create a password</label>
        <input type="password" id="password" minlength="10" required autocomplete="new-password" />
        <div class="note">At least 10 characters.</div>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" minlength="10" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn--primary" id="submitBtn">Activate My Account</button>
    </form>
  </div>

  <div class="card success" id="successView">
    <h2>Account created!</h2>
    <p>You'll be redirected to your portal where you'll need to sign the engagement letter to get started.</p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) { document.getElementById('loadingView').textContent = 'Invalid link. Please contact your accountant.'; }
else {
  (async () => {
    try {
      const res = await fetch('/api/setup-account?token=' + encodeURIComponent(token));
      if (!res.ok) throw Error();
      const data = await res.json();
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('formView').style.display = 'block';

      const SVC_LABELS = {
        tax: 'Business Tax Return',
        quarterly: 'Quarterly Tax Planning',
        monthly: 'Monthly Financial Review',
        cfo: 'Fractional CFO',
        bookkeeping: 'Bookkeeping',
      };
      const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
      const fmtMoney = n => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
      let html = '<div style="font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--brand-dark);margin-bottom:0.5rem;">Your Engagement</div>';
      if (data.businessName) html += `<div class="row"><span>Business</span><span class="val">${esc(data.businessName)}</span></div>`;
      html += `<div class="row"><span>Email</span><span class="val">${esc(data.email)}</span></div>`;
      if (data.services && data.services.length) {
        const names = data.services.map(s => SVC_LABELS[s] || (s.charAt(0).toUpperCase() + s.slice(1)));
        html += `<div class="row" style="align-items:flex-start;"><span>Services</span><span class="val" style="text-align:right;max-width:60%;">${names.map(esc).join('<br/>')}</span></div>`;
      }
      if (data.monthlyPrice > 0) html += `<div class="row"><span>Monthly fee</span><span class="val">${fmtMoney(data.monthlyPrice)}/month</span></div>`;
      if (data.yearlyPrice > 0) html += `<div class="row"><span>Annual total</span><span class="val">${fmtMoney(data.yearlyPrice)}/year</span></div>`;
      document.getElementById('pricingSummary').innerHTML = html;

      document.getElementById('setupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (pw !== confirm) { showError('Passwords do not match.'); return; }
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Setting up…';
        try {
          const res = await fetch('/api/setup-account', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: pw }),
          });
          if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Failed'); }
          const d = await res.json();
          sessionStorage.setItem('tv_portal_token', d.token);
          document.getElementById('formView').style.display = 'none';
          document.getElementById('successView').style.display = 'block';
          setTimeout(() => window.location.href = '/portal', 1500);
        } catch (e) { showError(e.message); btn.disabled = false; btn.textContent = 'Set Up Account'; }
      });
    } catch { document.getElementById('loadingView').textContent = 'This link has expired or is invalid.'; }
  })();
  function showError(m) { const el = document.getElementById('errorMsg'); el.textContent = m; el.style.display = 'block'; }
}
</script>
</body>
</html>
